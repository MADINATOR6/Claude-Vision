<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>3D Working Heart</title>
<style>
  :root {
    --panel-bg: rgba(15, 18, 26, 0.82);
    --accent-red: #ff5e6c;
    --accent-blue: #4fa3ff;
    --text: #e8ecf4;
    --text-dim: #9aa4b8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: radial-gradient(ellipse at 50% 30%, #1b2130 0%, #0a0c12 70%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
  }
  #canvas-root { position: absolute; inset: 0; }
  canvas { display: block; }

  #ui {
    position: absolute;
    top: 16px;
    left: 16px;
    width: 260px;
    background: var(--panel-bg);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 16px;
    backdrop-filter: blur(8px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    font-size: 13px;
  }
  #ui h1 {
    font-size: 15px;
    margin: 0 0 2px 0;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  #ui .subtitle {
    color: var(--text-dim);
    font-size: 11.5px;
    margin: 0 0 14px 0;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
    gap: 8px;
  }
  .row label { color: var(--text-dim); font-size: 12px; }
  .row input[type="range"] { flex: 1; margin: 0 8px; accent-color: var(--accent-red); }
  .row .val { min-width: 44px; text-align: right; font-variant-numeric: tabular-nums; }
  button {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    color: var(--text);
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 12.5px;
    cursor: pointer;
    transition: background 0.15s;
  }
  button:hover { background: rgba(255,255,255,0.14); }
  button.active { border-color: var(--accent-red); color: var(--accent-red); }
  .btn-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .checks { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
  .checks label {
    display: flex; align-items: center; gap: 7px;
    color: var(--text-dim); font-size: 12px; cursor: pointer;
  }
  hr { border: none; border-top: 1px solid rgba(255,255,255,0.08); margin: 12px 0; }

  #status {
    position: absolute;
    bottom: 16px;
    left: 16px;
    background: var(--panel-bg);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 10px 16px;
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  #phase-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent-blue);
    box-shadow: 0 0 10px 2px var(--accent-blue);
    transition: background 0.15s, box-shadow 0.15s;
  }
  #phase-label { font-size: 13px; font-weight: 600; letter-spacing: 0.02em; }
  #bpm-readout { font-size: 11.5px; color: var(--text-dim); }

  #legend {
    position: absolute;
    top: 16px;
    right: 16px;
    background: var(--panel-bg);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 12px 16px;
    backdrop-filter: blur(8px);
    font-size: 12px;
    color: var(--text-dim);
  }
  #legend .item { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  #legend .item:last-child { margin-bottom: 0; }
  #legend .swatch { width: 12px; height: 12px; border-radius: 3px; flex: none; }

  #hint {
    position: absolute;
    bottom: 16px;
    right: 16px;
    color: var(--text-dim);
    font-size: 11px;
    text-align: right;
    max-width: 220px;
    line-height: 1.4;
  }

  .label-sprite-hint { display: none; }
</style>
</head>
<body>

<div id="canvas-root"></div>

<div id="ui">
  <h1>3D Working Heart</h1>
  <p class="subtitle">Simplified anatomical model &mdash; cardiac cycle simulation</p>

  <div class="row">
    <label for="bpm">Heart rate</label>
    <input type="range" id="bpm" min="40" max="180" value="72" step="1" />
    <span class="val"><span id="bpm-val">72</span> bpm</span>
  </div>

  <div class="btn-row">
    <button id="play-pause">Pause</button>
    <button id="reset-view">Reset view</button>
    <button id="auto-rotate" class="active">Auto-rotate</button>
  </div>

  <hr />

  <div class="checks">
    <label><input type="checkbox" id="toggle-labels" checked /> Show chamber &amp; vessel labels</label>
    <label><input type="checkbox" id="toggle-flow" checked /> Show blood flow</label>
    <label><input type="checkbox" id="toggle-cutaway" /> Cutaway (see chambers)</label>
  </div>
</div>

<div id="legend">
  <div class="item"><span class="swatch" style="background:#e0384a;"></span>Oxygenated (LA &middot; LV &middot; Aorta)</div>
  <div class="item"><span class="swatch" style="background:#3a6fd8;"></span>Deoxygenated (RA &middot; RV &middot; PA)</div>
</div>

<div id="status">
  <div id="phase-dot"></div>
  <div>
    <div id="phase-label">Diastole</div>
    <div id="bpm-readout">72 bpm &middot; cycle 0.83 s</div>
  </div>
</div>

<div id="hint">Drag to orbit &middot; scroll to zoom &middot; right-drag to pan</div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/build/three.module.js",
    "three/addons/": "./vendor/three/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

/* ---------------------------------------------------------------------
   Scene setup
--------------------------------------------------------------------- */
const root = document.getElementById("canvas-root");
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0c12, 0.03);

const camera = new THREE.PerspectiveCamera(
  45, window.innerWidth / window.innerHeight, 0.1, 200
);
const DEFAULT_CAM_POS = new THREE.Vector3(0, 1.2, 9);
camera.position.copy(DEFAULT_CAM_POS);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
root.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 20;
controls.target.set(0, 0.3, 0);
controls.update();

/* Lighting */
scene.add(new THREE.AmbientLight(0xffffff, 0.55));

const keyLight = new THREE.DirectionalLight(0xfff2ea, 1.4);
keyLight.position.set(5, 8, 6);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(1024, 1024);
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0x9ec8ff, 0.6);
rimLight.position.set(-6, 3, -5);
scene.add(rimLight);

const fillLight = new THREE.PointLight(0xff8888, 0.4, 20);
fillLight.position.set(0, -2, 5);
scene.add(fillLight);

/* Ground shadow catcher (subtle) */
const groundGeo = new THREE.CircleGeometry(9, 48);
const groundMat = new THREE.ShadowMaterial({ opacity: 0.25 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -3.4;
ground.receiveShadow = true;
scene.add(ground);

/* ---------------------------------------------------------------------
   Materials
--------------------------------------------------------------------- */
const muscleRed = new THREE.MeshStandardMaterial({
  color: 0xb5222f, roughness: 0.55, metalness: 0.05,
  emissive: 0x330008, emissiveIntensity: 0.15,
});
const oxyRed = new THREE.MeshStandardMaterial({
  color: 0xe0384a, roughness: 0.45, metalness: 0.05,
  emissive: 0x3a0006, emissiveIntensity: 0.2,
});
const deoxyBlue = new THREE.MeshStandardMaterial({
  color: 0x3a6fd8, roughness: 0.45, metalness: 0.05,
  emissive: 0x030a33, emissiveIntensity: 0.2,
});
const vesselRedMat = new THREE.MeshStandardMaterial({
  color: 0xc23246, roughness: 0.5, metalness: 0.05,
});
const vesselBlueMat = new THREE.MeshStandardMaterial({
  color: 0x3560b0, roughness: 0.5, metalness: 0.05,
});

/* ---------------------------------------------------------------------
   Heart group
--------------------------------------------------------------------- */
const heart = new THREE.Group();
scene.add(heart);

function makeChamber(radiusXYZ, position, material, name) {
  const geo = new THREE.SphereGeometry(1, 32, 24);
  geo.scale(radiusXYZ.x, radiusXYZ.y, radiusXYZ.z);
  const mesh = new THREE.Mesh(geo, material);
  mesh.position.copy(position);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.name = name;
  mesh.userData.baseScale = new THREE.Vector3(1, 1, 1);
  heart.add(mesh);
  return mesh;
}

// Atria (top, smaller)
const rightAtrium = makeChamber(
  new THREE.Vector3(0.62, 0.58, 0.62), new THREE.Vector3(-1.05, 1.55, 0.35), deoxyBlue, "Right Atrium"
);
const leftAtrium = makeChamber(
  new THREE.Vector3(0.58, 0.55, 0.58), new THREE.Vector3(1.05, 1.55, -0.15), oxyRed, "Left Atrium"
);

// Ventricles (bottom, larger - left ventricle thicker/bigger, as in real anatomy)
// Note: positioned in standard anatomical-illustration orientation, i.e. as if
// facing a patient - the patient's right side (RA/RV) appears on the viewer's left.
const rightVentricle = makeChamber(
  new THREE.Vector3(0.85, 1.1, 0.85), new THREE.Vector3(-0.85, -0.35, 0.45), deoxyBlue, "Right Ventricle"
);
const leftVentricle = makeChamber(
  new THREE.Vector3(0.95, 1.3, 0.95), new THREE.Vector3(0.75, -0.5, -0.15), oxyRed, "Left Ventricle"
);

// Apex - fuses the ventricles visually at the bottom point of the heart
const apexGeo = new THREE.ConeGeometry(0.55, 1.3, 24);
const apex = new THREE.Mesh(apexGeo, muscleRed);
apex.position.set(0.15, -1.75, 0.1);
apex.rotation.x = Math.PI;
apex.castShadow = true;
heart.add(apex);
apex.userData.baseScale = new THREE.Vector3(1, 1, 1);

const allChambers = [rightAtrium, leftAtrium, rightVentricle, leftVentricle];
const atria = [rightAtrium, leftAtrium];
const ventricles = [rightVentricle, leftVentricle, apex];

/* ---------------------------------------------------------------------
   Great vessels (tubes along curves)
--------------------------------------------------------------------- */
function tubeFromPoints(points, radius, material, name) {
  const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(...p)));
  const geo = new THREE.TubeGeometry(curve, 64, radius, 12, false);
  const mesh = new THREE.Mesh(geo, material);
  mesh.castShadow = true;
  mesh.name = name;
  heart.add(mesh);
  return { mesh, curve };
}

// Superior vena cava -> right atrium
const svc = tubeFromPoints(
  [[-1.0, 3.4, 0.2], [-1.05, 2.6, 0.28], [-1.05, 1.9, 0.32]],
  0.22, vesselBlueMat, "Superior Vena Cava"
);
// Inferior vena cava -> right atrium
const ivc = tubeFromPoints(
  [[-1.15, -2.2, 1.0], [-1.12, -0.6, 0.75], [-1.08, 0.9, 0.5]],
  0.26, vesselBlueMat, "Inferior Vena Cava"
);
// Pulmonary artery: right ventricle -> lungs (arcs up-right then splits visually via two branch tubes)
const pa = tubeFromPoints(
  [[-0.9, 0.55, 0.55], [-0.6, 1.8, 0.1], [0.1, 2.7, -0.5], [0.6, 3.0, -0.9]],
  0.3, vesselBlueMat, "Pulmonary Artery"
);
const paBranchL = tubeFromPoints(
  [[0.6, 3.0, -0.9], [1.5, 3.2, -1.1]], 0.16, vesselBlueMat, "Pulmonary Artery (L)"
);
const paBranchR = tubeFromPoints(
  [[0.6, 3.0, -0.9], [-0.2, 3.4, -1.3]], 0.16, vesselBlueMat, "Pulmonary Artery (R)"
);
// Pulmonary veins: lungs -> left atrium
const pvL = tubeFromPoints(
  [[1.9, 2.7, -1.0], [1.5, 2.1, -0.6], [1.15, 1.75, -0.25]],
  0.16, vesselRedMat, "Pulmonary Vein (L)"
);
const pvR = tubeFromPoints(
  [[0.4, 2.8, -1.0], [0.7, 2.15, -0.5], [0.95, 1.8, -0.15]],
  0.16, vesselRedMat, "Pulmonary Vein (R)"
);
// Aorta: left ventricle -> aortic arch -> descending
const aorta = tubeFromPoints(
  [[0.65, 0.75, -0.35], [0.55, 1.9, -0.6], [-0.1, 3.05, -0.55],
   [-0.85, 2.9, -0.1], [-1.0, 2.0, 0.5], [-0.85, 0.4, 0.9]],
  0.3, vesselRedMat, "Aorta"
);

/* ---------------------------------------------------------------------
   Text-sprite labels
--------------------------------------------------------------------- */
function makeLabel(text, position, color = "#e8ecf4") {
  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");
  const scaleFactor = 4;
  canvas.width = 256 * scaleFactor;
  canvas.height = 64 * scaleFactor;
  ctx.scale(scaleFactor, scaleFactor);
  ctx.font = "600 26px -apple-system, Segoe UI, Roboto, sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  const w = ctx.measureText(text).width + 24;
  // pill background
  ctx.fillStyle = "rgba(10,12,18,0.78)";
  const h = 36, x = 128 - w / 2, y = 32 - h / 2, r = 10;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = color;
  ctx.fillText(text, 128, 33);

  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  const material = new THREE.SpriteMaterial({ map: texture, depthTest: false, transparent: true });
  const sprite = new THREE.Sprite(material);
  sprite.scale.set(1.6, 0.4, 1);
  sprite.position.copy(position);
  sprite.renderOrder = 999;
  heart.add(sprite);
  return sprite;
}

const labels = [
  makeLabel("Right Atrium", new THREE.Vector3(-2.1, 1.9, 0.35), "#8fb8ff"),
  makeLabel("Left Atrium", new THREE.Vector3(2.3, 1.9, -0.15), "#ff9aa4"),
  makeLabel("Right Ventricle", new THREE.Vector3(-2.15, -0.35, 0.45), "#8fb8ff"),
  makeLabel("Left Ventricle", new THREE.Vector3(2.15, -0.5, -0.15), "#ff9aa4"),
  makeLabel("Superior Vena Cava", new THREE.Vector3(-1.9, 3.4, 0.2), "#8fb8ff"),
  makeLabel("Inferior Vena Cava", new THREE.Vector3(-2.0, -2.2, 1.0), "#8fb8ff"),
  makeLabel("Pulmonary Artery", new THREE.Vector3(1.9, 3.35, -1.4), "#8fb8ff"),
  makeLabel("Pulmonary Veins", new THREE.Vector3(2.4, 2.85, -1.0), "#ff9aa4"),
  makeLabel("Aorta", new THREE.Vector3(-1.9, 2.0, 0.5), "#ff9aa4"),
];

/* ---------------------------------------------------------------------
   Blood flow particles
--------------------------------------------------------------------- */
const FLOW_COUNT_PER_PATH = 10;

function buildFlowPath(curves) {
  // Concatenate several curves' point samples into one continuous path with cumulative arc-length param.
  const samples = [];
  curves.forEach(curve => {
    const pts = curve.getPoints(40);
    pts.forEach(p => samples.push(p));
  });
  return new THREE.CatmullRomCurve3(samples);
}

const bluePath = buildFlowPath([ivc.curve, svc.curve, pa.curve]);
// crude manual path: IVC/SVC feed into RA -> RV -> PA. Build explicit ordered path instead:
const bluePathPoints = [
  ...ivc.curve.getPoints(10),
  new THREE.Vector3(-1.05, 1.55, 0.35),  // through right atrium
  new THREE.Vector3(-0.85, -0.35, 0.45), // through right ventricle
  ...pa.curve.getPoints(20),
];
const blueFlowCurve = new THREE.CatmullRomCurve3(bluePathPoints);

const redPathPoints = [
  ...pvL.curve.getPoints(8),
  new THREE.Vector3(1.05, 1.55, -0.15), // through left atrium
  new THREE.Vector3(0.75, -0.5, -0.15), // through left ventricle
  ...aorta.curve.getPoints(20),
];
const redFlowCurve = new THREE.CatmullRomCurve3(redPathPoints);

function makeFlowParticles(curve, color, count) {
  const geo = new THREE.SphereGeometry(0.06, 8, 8);
  const mat = new THREE.MeshStandardMaterial({
    color, emissive: color, emissiveIntensity: 0.9, roughness: 0.3,
  });
  const group = new THREE.Group();
  const particles = [];
  for (let i = 0; i < count; i++) {
    const mesh = new THREE.Mesh(geo, mat);
    const t0 = i / count;
    mesh.userData.t = t0;
    group.add(mesh);
    particles.push(mesh);
  }
  heart.add(group);
  return { group, particles, curve };
}

const blueFlow = makeFlowParticles(blueFlowCurve, 0x6fb0ff, FLOW_COUNT_PER_PATH);
const redFlow = makeFlowParticles(redFlowCurve, 0xff6b7a, FLOW_COUNT_PER_PATH);

/* ---------------------------------------------------------------------
   Cardiac cycle animation
--------------------------------------------------------------------- */
const clock = new THREE.Clock();
let bpm = 72;
let playing = true;
let elapsedAtPause = 0;

function smoothPulse(t, center, width) {
  // Smooth bump function peaking at t=center, 0 outside [center-width, center+width]
  const d = Math.abs(t - center);
  if (d > width) return 0;
  const x = d / width; // 0..1
  return 0.5 * (1 + Math.cos(x * Math.PI)); // cosine bump 1 -> 0
}

function updateCardiacCycle(t) {
  // t in [0, 1): 0 = start of atrial systole
  // Atrial systole ~ [0, 0.15], peak contraction ~0.07
  const atrialSqueeze = smoothPulse(t, 0.07, 0.09) * 0.16;
  // Ventricular systole ~ [0.15, 0.5], peak contraction ~0.30
  const ventricleSqueeze = smoothPulse(t, 0.30, 0.16) * 0.30;

  const atriaScale = 1 - atrialSqueeze;
  atria.forEach(m => {
    m.scale.set(atriaScale, 1 - atrialSqueeze * 0.6, atriaScale);
  });

  const ventScale = 1 - ventricleSqueeze;
  ventricles.forEach(m => {
    m.scale.set(ventScale, 1 - ventricleSqueeze * 0.7, ventScale);
  });

  // Great vessels bulge slightly during ejection (pressure wave)
  const ejectionBulge = 1 + smoothPulse(t, 0.34, 0.12) * 0.12;
  aorta.mesh.scale.set(ejectionBulge, 1, ejectionBulge);
  pa.mesh.scale.set(ejectionBulge, 1, ejectionBulge);

  // Phase label + indicator colour
  let phase, color;
  if (t < 0.15) { phase = "Atrial Systole"; color = "#ffd166"; }
  else if (t < 0.5) { phase = "Ventricular Systole"; color = "#ff5e6c"; }
  else { phase = "Diastole"; color = "#4fa3ff"; }
  phaseLabel.textContent = phase;
  phaseDot.style.background = color;
  phaseDot.style.boxShadow = `0 0 10px 2px ${color}`;

  return { t, phase };
}

function updateFlow(delta, cycleT) {
  // Base speed plus a boost during each ventricle's ejection phase
  const speedBoost = 1 + smoothPulse(cycleT, 0.30, 0.2) * 2.2;
  const baseSpeed = (bpm / 72) * 0.09 * speedBoost;

  [blueFlow, redFlow].forEach(flow => {
    flow.particles.forEach(p => {
      p.userData.t = (p.userData.t + baseSpeed * delta) % 1;
      const pos = flow.curve.getPointAt(p.userData.t);
      p.position.copy(pos);
    });
  });
}

/* ---------------------------------------------------------------------
   UI wiring
--------------------------------------------------------------------- */
const bpmSlider = document.getElementById("bpm");
const bpmVal = document.getElementById("bpm-val");
const bpmReadout = document.getElementById("bpm-readout");
const playPauseBtn = document.getElementById("play-pause");
const resetViewBtn = document.getElementById("reset-view");
const autoRotateBtn = document.getElementById("auto-rotate");
const toggleLabels = document.getElementById("toggle-labels");
const toggleFlow = document.getElementById("toggle-flow");
const toggleCutaway = document.getElementById("toggle-cutaway");
const phaseLabel = document.getElementById("phase-label");
const phaseDot = document.getElementById("phase-dot");

let autoRotate = true;

bpmSlider.addEventListener("input", () => {
  bpm = parseInt(bpmSlider.value, 10);
  bpmVal.textContent = bpm;
  bpmReadout.textContent = `${bpm} bpm · cycle ${(60 / bpm).toFixed(2)} s`;
});

playPauseBtn.addEventListener("click", () => {
  playing = !playing;
  playPauseBtn.textContent = playing ? "Pause" : "Play";
  if (playing) clock.start(); else clock.stop();
});

resetViewBtn.addEventListener("click", () => {
  camera.position.copy(DEFAULT_CAM_POS);
  controls.target.set(0, 0.3, 0);
  controls.update();
});

autoRotateBtn.addEventListener("click", () => {
  autoRotate = !autoRotate;
  autoRotateBtn.classList.toggle("active", autoRotate);
});

toggleLabels.addEventListener("change", () => {
  labels.forEach(l => l.visible = toggleLabels.checked);
});

toggleFlow.addEventListener("change", () => {
  blueFlow.group.visible = toggleFlow.checked;
  redFlow.group.visible = toggleFlow.checked;
});

toggleCutaway.addEventListener("change", () => {
  const opacity = toggleCutaway.checked ? 0.35 : 1.0;
  [muscleRed, oxyRed, deoxyBlue].forEach(m => {
    m.transparent = toggleCutaway.checked;
    m.opacity = opacity;
    m.depthWrite = !toggleCutaway.checked;
    m.needsUpdate = true;
  });
});

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ---------------------------------------------------------------------
   Render loop
--------------------------------------------------------------------- */
let totalTime = 0;

function animate() {
  requestAnimationFrame(animate);
  const delta = Math.min(clock.getDelta(), 0.05);

  if (playing) {
    totalTime += delta;
    const cycleDuration = 60 / bpm;
    const cycleT = (totalTime % cycleDuration) / cycleDuration;
    updateCardiacCycle(cycleT);
    updateFlow(delta, cycleT);
  }

  if (autoRotate) {
    heart.rotation.y += delta * 0.18;
  }

  controls.update();
  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
